name: health

on:
  schedule:
    # проверка живости источников — по понедельникам в 06:20 МСК
    - cron: "20 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка источников
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: none
        run: python -m news.cli check-sources --force
