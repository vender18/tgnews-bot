name: pipeline

on:
  schedule:
    # смена работает 5,5 часов и всё это время тикает сама;
    # частый cron GitHub душит, поэтому запусков в сутки немного, а покрытие сплошное
    - cron: "5 */5 * * *"
    # подстраховка: если смена не стартовала, одиночный тик всё равно пройдёт
    - cron: "35 */2 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Что выполнить"
        required: true
        default: tick
        type: choice
        options: [tick, serve, collect, check-sources, check-channels, digest, french, urgent, weekly, filter-report, stats]
      channel:
        description: "Канал для digest"
        required: false
        default: A
        type: choice
        options: [A, B, C]

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Выбор режима
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "5 */5 * * *" ]; then
            echo "command=serve" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "command=tick" >> $GITHUB_OUTPUT
          else
            echo "command=${{ github.event.inputs.command }}" >> $GITHUB_OUTPUT
          fi

      - name: Запуск
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_A: ${{ secrets.TG_CHANNEL_A }}
          TG_CHANNEL_B: ${{ secrets.TG_CHANNEL_B }}
          TG_CHANNEL_C: ${{ secrets.TG_CHANNEL_C }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
        run: |
          python -m news.cli ${{ steps.mode.outputs.command }} \
            --channel ${{ github.event.inputs.channel || 'A' }} \
            --interval 300 --minutes 320
